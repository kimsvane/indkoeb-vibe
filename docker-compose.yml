version: '3.8'

services:
  prisjagt:
    build: .
    container_name: prisjagt
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .env:/app/.env # Gør det muligt at opdatere API-nøgler uden at genbygge billedet
      - ./public:/app/public # Gør frontend-ændringer (HTML/JS/CSS) aktive ved genstart efter git pull
      - ./data:/app/data # Persisterer vareovervågning + notifikationskonfiguration
